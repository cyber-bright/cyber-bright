    <text x="30" y="132" font-size="15" font-weight="bold" letter-spacing="1" xml:space="preserve">██╔══██╗██╔══██╗██║██╔════╝ ██║  ██║╚══██╔══╝</text>
    <text x="30" y="152" font-size="15" font-weight="bold" letter-spacing="1" xml:space="preserve">██████╔╝██████╔╝██║██║  ███╗███████║   ██║   </text>
    <text x="30" y="172" font-size="15" font-weight="bold" letter-spacing="1" xml:space="preserve">██╔══██╗██╔══██╗██║██║   ██║██╔══██║   ██║   </text>
    <text x="30" y="192" font-size="15" font-weight="bold" letter-spacing="1" xml:space="preserve">██████╔╝██║  ██║██║╚██████╔╝██║  ██║   ██║   </text>
    <text x="30" y="212" font-size="15" font-weight="bold" letter-spacing="1" xml:space="preserve">╚═════╝ ╚═╝  ╚═╝╚═╝ ╚═════╝ ╚═╝  ╚═╝   ╚═╝   </text>
  </g>

  <line x1="30" y1="230" x2="870" y2="230" stroke="#00ff41" stroke-width="1" opacity="0.25" stroke-dasharray="2,3"/>

  <g fill="#00ff41" font-size="14">
    <text x="30" y="255" xml:space="preserve">&gt; SYSTEM STATUS ..... <tspan fill="#7fff9f">ONLINE</tspan></text>
    <text x="30" y="277" xml:space="preserve">&gt; TARGET ............ SOFTWARE ENGINEERING -&gt; CYBERSECURITY</text>
    <text x="30" y="299" xml:space="preserve">&gt; NODE ............... KNUST · DEPT. OF COMPUTER SCIENCE</text>
